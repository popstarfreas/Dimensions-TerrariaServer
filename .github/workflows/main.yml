name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events for the master and dev branches
on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Disable .NET CLI telemetry
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

  # Suppress ASP.NET development certificate generation on first call of .NET CLI
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

  DOTNET_NOLOGO: 'true'

  # Suppress costly first time experiences
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Test release automation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: .NET Restore
        uses: ./.github/actions/proj-restore

      - name: Build
        run: dotnet build --no-restore -c Debug /warnaserror

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: dimensions-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check source version and release state
        id: plan
        run: |
          # Keep the current automation when resuming a release of an older commit.
          cp .github/scripts/release.py "$RUNNER_TEMP/dimensions-release.py"
          python3 "$RUNNER_TEMP/dimensions-release.py" prepare --state "$RUNNER_TEMP/dimensions-release.json"

      - name: Checkout release commit
        if: steps.plan.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan.outputs.commit }}

      - name: Verify release source
        if: steps.plan.outputs.publish == 'true'
        run: python3 "$RUNNER_TEMP/dimensions-release.py" verify --state "$RUNNER_TEMP/dimensions-release.json"

      - name: .NET Restore
        if: steps.plan.outputs.publish == 'true'
        uses: ./.github/actions/proj-restore

      - name: Build release
        if: steps.plan.outputs.publish == 'true'
        run: dotnet build --no-restore -c Release /warnaserror

      - name: Publish release
        if: steps.plan.outputs.publish == 'true'
        run: python3 "$RUNNER_TEMP/dimensions-release.py" publish --state "$RUNNER_TEMP/dimensions-release.json"

