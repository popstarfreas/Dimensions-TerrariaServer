name: Project Restore
description: 'Install .NET 9 and restore NuGet packages'
runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '9.0.x'

    - name: Fetch packages cache
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-dotnet9-nuget-${{ hashFiles('**/*.csproj') }}

    - name: Restore packages
      shell: bash
      run: dotnet restore
